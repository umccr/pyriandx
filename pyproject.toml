[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyriandx"
dynamic = ["version"]
authors = [
    {name = "UMCCR and Contributors", email = "services@umccr.org"}
]
description = "API client CLI/SDK for PierianDx web services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10, <3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2, <3",
    "urllib3>=2, <3",
    "docopt>=0.6.2, <1",
    "coloredlogs>=15.0, <16",
    "verboselogs>=1.7, <2",
    "colorama>=0.4.4, <1",
]

[project.urls]
Homepage = "https://github.com/umccr/pyriandx"
"Bug Tracker" = "https://github.com/umccr/pyriandx/issues"

[project.optional-dependencies]
dev = [
    "pipdeptree>=2.0, <3",
    "sphinx>=8, <10",
    "twine>=3.4, <4",
    "setuptools>=60.0",
    "wheel>=0.36, <1",
    "build>=0.7, <1",
    "pdoc3>=0.11.6",
    "tox>=3.24",
    "nose2>=0.10",
    "pre-commit>=2.13",
    "detect-secrets>=1.1",
    "ggshield>=1.9",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "flake8>=3.9",
    "mockito>=1.3",
]

[project.scripts]
pyriandx = "pyriandx.cli:main"

[tool.setuptools.packages.find]
exclude = ["tests", "docs"]

[tool.setuptools.dynamic]
version = {attr = "pyriandx.__version__"}

[tool.setuptools.package-data]
pyriandx = ["json/*.json"]
